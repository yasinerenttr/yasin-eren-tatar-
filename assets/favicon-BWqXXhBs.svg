<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="50%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#ff6b9d"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161626"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background Card with Glow Border -->
  <rect x="28" y="28" width="456" height="456" rx="128" fill="url(#darkBg)" stroke="url(#neonGrad)" stroke-width="20"/>
  
  <!-- Cyber Code Accents -->
  <path d="M125 185 L75 256 L125 327" fill="none" stroke="#6c63ff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M387 185 L437 256 L387 327" fill="none" stroke="#00d4aa" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  
  <!-- Monogram YE -->
  <g fill="url(#neonGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="190" text-anchor="middle">
    <text x="256" y="324" letter-spacing="-8">YE</text>
  </g>
  
  <!-- Cyber Accent Dot -->
  <circle cx="355" cy="175" r="16" fill="#00d4aa"/>
</svg>